# Apache as reverse proxy in front of Gunicorn (running on 127.0.0.1:8001).
# Static files are served directly by Apache for performance.

# Bare-bones global hardening
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerAdmin admin@example.com
    ServerName localhost

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Static files: served straight from disk by Apache (no proxy hop)
    Alias /static/ /app/staticfiles/
    <Directory /app/staticfiles>
        Require all granted
        Options -Indexes
        # Cache static assets aggressively
        <FilesMatch "\.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$">
            Header set Cache-Control "public, max-age=2592000"
        </FilesMatch>
    </Directory>

    # Don't proxy /static — Apache already handles it
    ProxyPass /static/ !

    # Reverse proxy everything else to Gunicorn
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8001/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:8001/

    # Pass client IP to Django (used together with USE_X_FORWARDED_HOST/SECURE_PROXY_SSL_HEADER if needed)
    RequestHeader set X-Forwarded-Proto "http"

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
</VirtualHost>
