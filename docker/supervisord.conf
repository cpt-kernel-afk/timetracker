[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# Gunicorn — runs the Django app on 127.0.0.1:8001 (only reachable inside the container)
[program:gunicorn]
command=/usr/local/bin/gunicorn config.wsgi:application
    --bind 127.0.0.1:8001
    --workers 3
    --threads 2
    --timeout 120
    --access-logfile -
    --error-logfile -
    --log-level info
directory=/app
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Apache — reverse proxy, also serves static files
[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Kill the whole container if either gunicorn or apache stays down — keeps healthchecks honest
[eventlistener:fatal_quit]
command=bash -c "printf 'READY\n' && while read line; do kill -SIGTERM $PPID; done"
events=PROCESS_STATE_FATAL
